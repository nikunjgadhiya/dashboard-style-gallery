<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('mtheme:m-watch.html');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch · TIFFNY Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mobile.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#ffffff;--surface:#f2f2f7;--surface-2:#e5e5ea;--text:#000000;--muted:#6e6e73;--line:#0000001a;--accent:#ff2d55;--on-accent:#ffffff;--ok:#34c759;--warn:#ff9500;--bad:#ff3b30;--c1:#fa114f;--c2:#7ac70c;--c3:#00b4d8;--c4:#ff9500;--c5:#af52de;--radius:20px;--font:-apple-system,BlinkMacSystemFont,'SF Compact','Inter',system-ui,sans-serif}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000000;--surface:#1c1c1e;--surface-2:#2c2c2e;--text:#ffffff;--muted:#98989d;--line:#ffffff1f;--accent:#ff375f;--on-accent:#ffffff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;--c1:#fa114f;--c2:#a6ff00;--c3:#00f0ff;--c4:#ff9f0a;--c5:#bf5af2}
:root{--shadow:none;--shadow-sm:none;--stage:radial-gradient(circle at 50% 40%,#f4f4f6,#dcdce2);--stage-text:#1c1c1e;--frame:#2c2c2e}
:root[data-theme="dark"]{--stage:radial-gradient(circle at 50% 40%,#2a2a30,#0c0c0e);--stage-text:#f5f5f7;--stage-on:#000;--stage-chip:rgba(255,255,255,.1)}
/* watch case on desktop */
@media (min-width:501px){
  .device{width:288px;height:348px;border-radius:78px;padding:16px;background:linear-gradient(145deg,#4a4a50,#1c1c1e 40%,#3a3a40);position:relative;box-shadow:0 0 0 2px #0d0d0f,0 30px 60px -16px rgba(0,0,0,.55)}
  .device::before{content:"";position:absolute;right:-12px;top:96px;width:14px;height:52px;border-radius:7px;background:repeating-linear-gradient(180deg,#5a5a60 0 2px,#3a3a40 2px 4px);box-shadow:inset 0 0 0 1px #222}
  .device::after{content:"";position:absolute;right:-7px;top:176px;width:8px;height:46px;border-radius:4px;background:#3a3a40}
  .app{border-radius:62px}
  .statusbar{height:30px;padding:8px 34px 0;font-size:13px;justify-content:flex-end}
  .statusbar .time,.sb-icons,.island{display:none}
  .home-ind{display:none}
  .screen{padding:0 16px 66px}
  .screen:not([data-screen="home"])>*{zoom:.74}
  .tabbar{padding:4px 18px 12px;grid-template-columns:repeat(5,1fr);border:0;background:linear-gradient(transparent,var(--bg) 30%)}
  .tabbar button span{display:none}
  .tabbar button .ic{width:18px;height:18px}
  .tabbar .scan-tab .si{width:34px;height:34px;margin-top:-6px;border-radius:50%;box-shadow:none}
  .tabbar .scan-tab .si .ic{width:18px;height:18px}
  .watch{zoom:.86}
}
.watch{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:2px}
.wf-time{align-self:stretch;display:flex;justify-content:space-between;align-items:baseline}
.wf-time small{color:var(--c1);font-weight:700;font-size:13px}
.wf-time b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.rings{position:relative;width:170px;height:170px;margin:4px 0}
.ring{position:absolute;border-radius:50%;
  background:conic-gradient(var(--rc) calc(var(--p)*1%),color-mix(in srgb,var(--rc) 22%,transparent) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 17px),#000 calc(100% - 16px));mask:radial-gradient(farthest-side,transparent calc(100% - 17px),#000 calc(100% - 16px))}
.r1{inset:0;--rc:var(--c1)}.r2{inset:19px;--rc:var(--c2)}.r3{inset:38px;--rc:var(--c3)}
.rings span{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.rings span .ic{width:26px;height:26px}
.ring-key{list-style:none;align-self:stretch;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.ring-key li{display:flex;gap:8px;align-items:baseline}
.ring-key b{font-size:16px;font-weight:800;min-width:80px}
.ring-key .k1 b{color:var(--c1)}.ring-key .k2 b{color:var(--c2)}.ring-key .k3 b{color:var(--c3)}
:root[data-theme="light"] .ring-key .k2 b{color:#4f8a00}
.comps{display:flex;gap:12px;margin:4px 0}
.comps button{position:relative;width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.comps button:nth-child(2){color:var(--c4)}.comps button:nth-child(3){color:var(--c3)}
.comps b{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center}
.w-alert{align-self:stretch;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:22px;background:var(--surface);text-align:left;font-size:12.5px;color:var(--muted)}
.w-alert .ic{color:var(--bad);width:22px;height:22px}
.w-alert b{display:block;color:var(--text);font-size:14px}
.watch .list{align-self:stretch;background:var(--surface);border-radius:22px;padding:2px 12px}
.watch .row{padding:9px 0}
.watch .thumb{width:32px;height:32px;border-radius:50%}
.chip.on,.btn.primary{background:var(--accent)}
.card,.list.boxed,.kpi,.tile,.stat,.sheet{border-radius:24px}
.tabbar{background:var(--bg);border-top:0}
.tabbar button.on{color:var(--accent)}
.tabbar .scan-tab .si{border-radius:50%}
</style>
</head>
<body data-name="Wearable Companion" data-desc="Smartwatch companion: a watch frame on desktop, an activity-ring face for stock health, orders goal and low stock, round complications and glanceable alerts." data-flutter="flutter/themes/watch_theme.dart">
<div class="stage">
  <aside class="panel" id="panel"></aside>
  <div class="device"><div class="app" id="app"></div></div>
</div>
<script>
window.MobileVariant = function variant(h) {
  h.SCREENS.home = () => `
    <div class="watch">
      <div class="wf-time"><small>WED 7</small><b>9:41</b></div>
      <div class="rings" aria-label="Stock health 72%, orders goal 64%, low stock 46%">
        <i class="ring r1" style="--p:72"></i><i class="ring r2" style="--p:64"></i><i class="ring r3" style="--p:46"></i><span>${h.icon('box')}</span></div>
      <ul class="ring-key"><li class="k1"><b>72%</b>Stock health</li><li class="k2"><b>4.1k/6.4k</b>Orders goal</li><li class="k3"><b>1,705</b>Low stock</li></ul>
      <div class="comps">
        <button data-go="scan" aria-label="Scan">${h.icon('scan')}</button>
        <button data-go="alerts" aria-label="Alerts">${h.icon('bell')}<b>3</b></button>
        <button data-go="orders" aria-label="Orders">${h.icon('bag')}</button></div>
      <button class="w-alert" data-go="alerts">${h.icon('alert')}<span><b>Out of stock</b>MC-14-GREEN-32 · Amazon</span></button>
      <div class="list">${h.SKUS.filter((s) => s.status !== 'in').slice(0, 3).map(h.skuRow).join('')}</div>
    </div>`;
};
</script>
<script src="assets/mobile.js"></script>
</body>
</html>
