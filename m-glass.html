<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('mtheme:m-glass.html');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glassmorphism · TIFFNY Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mobile.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#eef1fb;--surface:#ffffff80;--surface-2:#ffffff59;--text:#1e2340;--muted:#5a6085;--line:#1e234019;--accent:#5b6cff;--on-accent:#ffffff;--ok:#059669;--warn:#d97706;--bad:#e11d48;--c1:#3b82f6;--c2:#10b981;--c3:#a855f7;--c4:#f97316;--c5:#ec4899;--radius:22px;--font:'Inter',system-ui,sans-serif}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1026;--surface:#ffffff14;--surface-2:#ffffff0f;--text:#eef2ff;--muted:#b9c0e6;--line:#ffffff21;--accent:#7dd3fc;--on-accent:#0b1026;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--c1:#60a5fa;--c2:#34d399;--c3:#c084fc;--c4:#fb923c;--c5:#f472b6}
:root{--blobs:radial-gradient(50% 30% at 10% 12%,rgba(167,139,250,.6),transparent 70%),radial-gradient(45% 30% at 95% 30%,rgba(96,165,250,.55),transparent 70%),radial-gradient(55% 35% at 80% 92%,rgba(244,114,182,.45),transparent 70%),radial-gradient(45% 30% at 10% 75%,rgba(45,212,191,.4),transparent 70%);
  --edge:rgba(255,255,255,.75);--shadow:0 10px 30px rgba(76,86,140,.14);--shadow-sm:none;--stage:linear-gradient(135deg,#e7e3ff,#dcecff);--stage-text:#1e2340}
:root[data-theme="dark"]{--blobs:radial-gradient(50% 30% at 10% 12%,rgba(124,58,237,.8),transparent 70%),radial-gradient(45% 30% at 95% 30%,rgba(37,99,235,.75),transparent 70%),radial-gradient(55% 35% at 80% 92%,rgba(219,39,119,.6),transparent 70%),radial-gradient(45% 30% at 10% 75%,rgba(8,145,178,.6),transparent 70%);
  --edge:rgba(255,255,255,.18);--shadow:0 10px 30px rgba(2,6,23,.4);--stage:linear-gradient(135deg,#1a1240,#0b1026 60%,#2a0d2e);--stage-text:#eef2ff;--stage-on:#0b1026;--stage-chip:rgba(255,255,255,.1);--tip-bg:rgba(15,23,42,.92)}
.app{background:var(--blobs),var(--bg)}
.card,.kpi,.list.boxed,.search,.chip,.icon-btn,.stat,.tile,.sheet,.quick .qi,.btn,.input,.avatar{backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.14)}
.avatar{background:linear-gradient(135deg,#60a5fa,#c084fc);color:#fff}
.kpi-i{background:color-mix(in srgb,var(--k) 30%,transparent);color:var(--k);border:1px solid var(--edge)}
:root[data-theme="dark"] .kpi-i{color:color-mix(in srgb,var(--k) 60%,#fff)}
.chip.on{background:linear-gradient(135deg,#7dd3fc,#a78bfa);color:#0b1026;border-color:transparent;font-weight:700}
:root[data-theme="light"] .chip.on{background:linear-gradient(135deg,#5b6cff,#a855f7);color:#fff}
.btn.primary{background:linear-gradient(135deg,#7dd3fc,#a78bfa);color:#0b1026}
.screen.scan{--scan-bg:transparent}
.tabbar{left:12px;right:12px;bottom:22px;border-radius:26px;padding:8px 6px;background:var(--surface);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--edge);align-items:center}
.tabbar button.on{color:var(--text)}
.tabbar button.on .ic{color:var(--accent)}
:root[data-theme="light"] .tabbar button.on .ic{color:var(--accent)}
.tabbar .scan-tab .si{width:50px;height:50px;margin:0;border-radius:16px;background:linear-gradient(135deg,#7dd3fc,#a78bfa);color:#0b1026;box-shadow:0 8px 20px -6px rgba(125,211,252,.6)}
.home-ind{bottom:5px}
@media (max-width:500px){.tabbar{bottom:max(12px,env(safe-area-inset-bottom))}}
</style>
</head>
<body data-name="Glassmorphism Mobile" data-desc="Classic frosted glass: translucent panels with thin white borders floating over glowing violet, blue and pink blobs, with a glass tab bar. Dark by default." data-flutter="flutter/themes/glass_theme.dart">
<div class="stage">
  <aside class="panel" id="panel"></aside>
  <div class="device"><div class="app" id="app"></div></div>
</div>
<script src="assets/mobile.js"></script>
</body>
</html>
