<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('mtheme:m-clay.html');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claymorphism · TIFFNY Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mobile.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#efeafd;--surface:#fbfaff;--surface-2:#f1edff;--text:#2e2a4f;--muted:#7a7499;--line:#2e2a4f14;--accent:#7c6cf2;--on-accent:#ffffff;--ok:#2fa982;--warn:#e08c1a;--bad:#f0507a;--c1:#7c6cf2;--c2:#4fd1a5;--c3:#ffb547;--c4:#ff7eb6;--c5:#5ec8f2;--radius:30px;--font:'Nunito',system-ui,sans-serif}
:root[data-theme="dark"]{color-scheme:dark;--bg:#17152a;--surface:#24213d;--surface-2:#2d2950;--text:#ece9ff;--muted:#a49ec6;--line:#ffffff14;--accent:#8f80ff;--on-accent:#ffffff;--ok:#4fd1a5;--warn:#ffb547;--bad:#ff7e9a;--c1:#8f80ff;--c2:#4fd1a5;--c3:#ffb547;--c4:#ff7eb6;--c5:#5ec8f2}
:root{--clay:0 16px 30px -12px rgba(92,72,170,.32),inset -6px -6px 12px rgba(92,72,170,.10),inset 6px 6px 12px rgba(255,255,255,.95);
  --clay-sm:0 8px 16px -8px rgba(92,72,170,.35),inset -3px -3px 6px rgba(92,72,170,.10),inset 3px 3px 6px rgba(255,255,255,.9);
  --pill:0 10px 18px -8px rgba(124,108,242,.7),inset -4px -4px 8px rgba(0,0,0,.14),inset 4px 4px 8px rgba(255,255,255,.4);
  --shadow:var(--clay);--shadow-sm:var(--clay-sm);--stage:radial-gradient(circle at 20% 10%,#fde4f1,transparent 40%),radial-gradient(circle at 90% 90%,#dbf1ff,transparent 45%),#efeafd;--stage-text:#2e2a4f;
  --k1:#e9e5ff;--k2:#dbf7ed;--k3:#fff1d6;--k4:#ffe3ef;--bar-radius:12;--donut-radius:16;--donut-spacing:5;--donut-bw:0;--tip-bg:#2e2a4f;--tip-radius:14}
:root[data-theme="dark"]{--clay:0 16px 30px -12px rgba(0,0,0,.6),inset -6px -6px 12px rgba(0,0,0,.28),inset 6px 6px 12px rgba(255,255,255,.07);
  --clay-sm:0 8px 16px -8px rgba(0,0,0,.6),inset -3px -3px 6px rgba(0,0,0,.25),inset 3px 3px 6px rgba(255,255,255,.06);
  --k1:#2f2956;--k2:#1c3b34;--k3:#3d3220;--k4:#3e2236;--stage:#17152a;--stage-text:#ece9ff;--stage-on:#17152a;--stage-chip:rgba(255,255,255,.08)}
body{font-weight:600}
.app{background:radial-gradient(circle at 15% 5%,color-mix(in srgb,var(--c4) 18%,transparent),transparent 35%),radial-gradient(circle at 95% 95%,color-mix(in srgb,var(--c5) 16%,transparent),transparent 40%),var(--bg)}
.app-head h1,.hello h1{font-weight:900}
.kpi{border-radius:28px}
.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}.k4{background:var(--k4)}
.kpi-i{border-radius:16px;width:42px;height:42px;box-shadow:0 8px 14px -6px var(--k),inset -3px -3px 6px rgba(0,0,0,.14),inset 3px 3px 6px rgba(255,255,255,.45)}
.kpi strong{font-weight:900}
.chip{font-weight:800;border-radius:18px}
.chip.on{background:var(--accent);color:#fff;box-shadow:var(--pill)}
.quick .qi{border-radius:22px}
.btn,.chip,.quick .qi,.kpi,.tile,.icon-btn{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.btn:active,.chip:active,.quick button:active .qi,.kpi:active,.tile:active,.icon-btn:active{transform:scale(.92)}
.btn{border-radius:20px;font-weight:800}
.btn.primary{box-shadow:var(--pill)}
.avatar{background:var(--c4);color:#fff;box-shadow:var(--clay-sm)}
.thumb{border-radius:16px;box-shadow:inset -3px -3px 6px rgba(0,0,0,.2),inset 3px 3px 6px rgba(255,255,255,.35)}
.search{border-radius:22px}
.badge{box-shadow:inset 2px 2px 3px rgba(255,255,255,.5)}
.pbar .track{height:12px;box-shadow:inset 2px 2px 4px rgba(92,72,170,.15)}
.set .si,.tile .ti{border-radius:14px;box-shadow:inset -2px -2px 4px rgba(0,0,0,.15),inset 2px 2px 4px rgba(255,255,255,.4)}
.switch.on{background:var(--accent);box-shadow:var(--pill)}
.tabbar{left:12px;right:12px;bottom:20px;border-radius:30px;border:0;padding:8px 6px;background:var(--surface);box-shadow:var(--clay);align-items:center}
.tabbar button{font-weight:800}
.tabbar .scan-tab .si{width:58px;height:58px;margin-top:-26px;border-radius:22px;box-shadow:var(--pill)}
.home-ind{bottom:5px}
@media (max-width:500px){.tabbar{bottom:max(10px,env(safe-area-inset-bottom))}}
</style>
</head>
<body data-name="Claymorphism Mobile" data-desc="Puffy inflated pastel cards with clay inner shadows, a different pastel per KPI, bouncy squish-on-press buttons and a chunky purple clay scan button." data-flutter="flutter/themes/clay_theme.dart">
<div class="stage">
  <aside class="panel" id="panel"></aside>
  <div class="device"><div class="app" id="app"></div></div>
</div>
<script src="assets/mobile.js"></script>
</body>
</html>
