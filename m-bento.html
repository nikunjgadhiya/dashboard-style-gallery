<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('mtheme:m-bento.html');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bento · TIFFNY Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mobile.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f4f4f1;--surface:#ffffff;--surface-2:#f4f4f1;--text:#18181b;--muted:#71717a;--line:#e7e5e4;--accent:#18181b;--on-accent:#ffffff;--ok:#16a34a;--warn:#d97706;--bad:#e11d48;--c1:#4f46e5;--c2:#22c55e;--c3:#f59e0b;--c4:#ec4899;--c5:#06b6d4;--radius:24px;--font:'Plus Jakarta Sans',system-ui,sans-serif}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0b0c;--surface:#161618;--surface-2:#1f1f22;--text:#f4f4f5;--muted:#a1a1aa;--line:#27272a;--accent:#bef264;--on-accent:#18181b;--ok:#4ade80;--warn:#fbbf24;--bad:#fb7185;--c1:#818cf8;--c2:#4ade80;--c3:#fbbf24;--c4:#f472b6;--c5:#22d3ee}
:root{--shadow:none;--shadow-sm:none;--bar:#bef264;--bar-radius:6;--stage:#ecece8;--stage-text:#18181b;--donut-cutout:68%;--donut-spacing:3}
:root[data-theme="dark"]{--stage:#111113;--stage-text:#f4f4f5;--stage-on:#18181b;--stage-chip:rgba(255,255,255,.08)}
.card,.list.boxed,.kpi,.stat,.tile,.search,.icon-btn,.chip,.sheet,.input,.btn{border:1px solid var(--line)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bento>*{border-radius:24px;background:var(--surface);border:1px solid var(--line);text-align:left}
.b-hero{grid-column:1/-1;background:#18181b;border-color:#18181b;color:#fafafa;padding:18px}
:root[data-theme="dark"] .b-hero{background:#000;border-color:#2e3b14}
.b-top{display:flex;justify-content:space-between;align-items:center}
.b-hero small{color:#a1a1aa;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(190,242,100,.15);color:#bef264}
.pill .ic{width:13px;height:13px}
.b-hero strong{display:block;font-size:42px;font-weight:800;letter-spacing:-.03em;color:#bef264;margin:4px 0 2px}
.b-hero .chart-sm{height:110px}
.bento .kpi{margin:0;border-radius:24px}
.bento .k1{background:#d9f99d;border-color:#c5ef7f;color:#18181b}
.bento .k1 small,.bento .k1 .delta{color:#3f4a1f}
.bento .k1 .kpi-i{background:#18181b;color:#d9f99d}
.kpi-i{border-radius:12px;background:var(--surface-2);color:var(--text)}
.bento .k4 .kpi-i{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.b-scan{display:flex;flex-direction:column;justify-content:space-between;padding:16px;min-height:132px;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.b-scan .ic{width:30px;height:30px}
.b-scan b{font-size:20px;font-weight:800}
.b-scan small{opacity:.7;font-weight:600}
.b-donut{grid-column:1/-1;display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;padding:16px}
.b-donut .donut{height:120px}
.b-alert,.b-po{padding:16px;display:flex;flex-direction:column;gap:2px}
.b-alert b,.b-po b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.b-alert b{color:var(--bad)}
.b-alert span,.b-po span{font-weight:700}
.b-alert small,.b-po small{color:var(--muted);font-size:12px}
.b-list{grid-column:1/-1;padding:14px 16px 4px}
.chip.on{background:var(--accent);color:var(--on-accent)}
.icon-btn{border-radius:14px}
.avatar{background:#bef264;color:#18181b;border-radius:14px}
.tabbar{border-top:1px solid var(--line)}
.tabbar button.on{color:var(--text)}
.tabbar .scan-tab .si{border-radius:18px;background:#18181b;color:#bef264;box-shadow:none}
:root[data-theme="dark"] .tabbar .scan-tab .si{background:#bef264;color:#18181b}
</style>
</head>
<body data-name="Bento Mobile" data-desc="A single-column bento grid of mixed-size tiles: black hero with lime bars, compact KPI tiles, a wide donut tile and quick scan/alert tiles, with thin borders and big radii." data-flutter="flutter/themes/bento_theme.dart">
<div class="stage">
  <aside class="panel" id="panel"></aside>
  <div class="device"><div class="app" id="app"></div></div>
</div>
<script>
window.MobileVariant = function variant(h) {
  const total = h.STOCK.reduce((a, b) => a + b, 0);
  h.SCREENS.home = () => `
    <header class="app-head"><div class="hello"><small>Wed, 7 Oct</small><h1>Overview</h1></div>
      <button class="icon-btn" data-go="alerts" aria-label="Alerts">${h.icon('bell')}<b>3</b></button><button class="avatar" data-go="profile" aria-label="Profile">R</button></header>
    <div class="bento">
      <section class="b-hero"><div class="b-top"><small>Orders · this month</small><span class="pill">${h.icon('trend')}+18.7%</span></div>
        <strong>6,420</strong><div class="chart-sm"><canvas data-chart="bars"></canvas></div></section>
      ${[['k1', 'box', 'Total stock', '1,45,288', 12.5, 'stock'], ['k3', 'tag', 'Total SKU', '3,179', 9.3, 'stock'], ['k4', 'alert', 'Low stock', '1,705', -5.2, 'stock']]
        .map(([k, ic, l, v, d, g]) => `<button class="kpi ${k}" data-go="${g}"><span class="kpi-i">${h.icon(ic)}</span><small>${l}</small><strong>${v}</strong><span class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}%</span></button>`).join('')}
      <button class="b-scan" data-go="scan">${h.icon('scan')}<b>Scan</b><small>Barcode</small></button>
      <section class="b-donut"><div class="donut"><canvas data-chart="donut"></canvas><div class="donut-c"><b>${h.lakh(total)}</b><span>units</span></div></div>
        <ul class="legend">${h.PLATFORMS.map((p, j) => `<li><i style="background:var(--c${j + 1})"></i><span>${p}</span><b>${Math.round((h.STOCK[j] / total) * 100)}%</b></li>`).join('')}</ul></section>
      <button class="b-alert" data-go="alerts"><b>3</b><span>new alerts</span><small>1 out of stock</small></button>
      <button class="b-po" data-go="po"><b>3</b><span>open POs</span><small>₹9.2 L value</small></button>
      <section class="b-list"><div class="card-h"><h3>Top sellers</h3><button class="link" data-go="stock">All</button></div><div class="list">${h.SKUS.slice(0, 3).map(h.skuRow).join('')}</div></section>
    </div>`;
};
</script>
<script src="assets/mobile.js"></script>
</body>
</html>
